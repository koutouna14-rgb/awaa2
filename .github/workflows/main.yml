
name: SpawnGuard Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SpawnGuard

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: SpawnGuard/pom.xml

      - name: Build SpawnGuard
        run: mvn -B clean package

      - name: Upload SpawnGuard JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpawnGuard
          path: SpawnGuard/target/*.jar
          if-no-files-found: error
